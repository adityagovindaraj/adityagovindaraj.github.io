<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Photographs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --gap: 4px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body {
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  html.lock { overflow: hidden; }

  /* ---------- grid ---------- */
  #grid {
    position: relative;
    margin: var(--gap) max(var(--gap), env(safe-area-inset-right)) calc(var(--gap) + env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
  }
  #grid a {
    position: absolute;
    display: block;
    overflow: hidden;
    cursor: zoom-in;
    outline: none;
  }
  #grid a:focus-visible { box-shadow: 0 0 0 2px #fff; z-index: 1; }
  #grid img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .5s ease, filter .3s ease;
    -webkit-user-drag: none;
    user-select: none;
  }
  #grid img.in { opacity: 1; }
  @media (hover: hover) {
    #grid a:hover img.in { filter: brightness(1.08); }
  }
  #grid a.ghost img { visibility: hidden; }

  /* ---------- viewer ---------- */
  #lb {
    position: fixed;
    inset: 0;
    z-index: 10;
    touch-action: none;
    overscroll-behavior: contain;
    user-select: none;
    -webkit-user-select: none;
  }
  #lb[hidden] { display: none; }
  #shade { position: absolute; inset: 0; background: #000; }
  #lbi {
    position: absolute;
    transform-origin: 0 0;
    will-change: transform, opacity;
    -webkit-user-drag: none;
  }
  #lb.prev  { cursor: w-resize; }
  #lb.next  { cursor: e-resize; }
  #lb.close { cursor: zoom-out; }
  #lb.idle  { cursor: none; }
</style>
</head>
<body>
<main id="grid"></main>
<div id="lb" hidden><div id="shade"></div><img id="lbi" alt="" draggable="false"></div>

<script id="photos" type="application/json">[]</script>
<script>
(() => {
  const P = JSON.parse(document.getElementById('photos').textContent);
  const grid = document.getElementById('grid');
  const lb = document.getElementById('lb');
  const shade = document.getElementById('shade');
  const img = document.getElementById('lbi');
  const GAP = 4;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const D = reduce ? 1 : 340;                     // open / close duration
  const EASE = 'cubic-bezier(.2,.8,.2,1)';
  const byId = new Map(P.map((p, i) => [p.id, i]));
  const tiles = [];
  const fullCache = new Map();

  /* ---------------- grid ---------------- */
  P.forEach((p, i) => {
    const a = document.createElement('a');
    a.href = '#' + p.id;
    a.style.background = p.c;
    const t = new Image();
    t.alt = '';
    t.loading = 'lazy';
    t.decoding = 'async';
    t.draggable = false;
    t.onload = () => t.classList.add('in');
    t.src = p.t;
    a.appendChild(t);
    a.addEventListener('click', e => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
      e.preventDefault();
      open(i, true);
    });
    a.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') loadFull(i); });
    grid.appendChild(a);
    tiles.push(a);
  });

  function targetHeight(W) {
    return W < 640 ? Math.max(140, W * 0.42) : Math.min(380, 180 + W * 0.1);
  }

  let lastW = 0;
  function layout() {
    const W = grid.clientWidth;
    if (!W || W === lastW) return;
    lastW = W;
    const T = targetHeight(W);
    let y = 0, row = [], sum = 0;

    const place = (items, h, stretch) => {
      let x = 0;
      items.forEach((i, k) => {
        const w = P[i].w / P[i].h * h;
        const left = Math.round(x);
        const right = (stretch && k === items.length - 1) ? W : Math.round(x + w);
        const s = tiles[i].style;
        s.left = left + 'px'; s.top = Math.round(y) + 'px';
        s.width = (right - left) + 'px'; s.height = Math.round(h) + 'px';
        x += w + GAP;
      });
      y += Math.round(h) + GAP;
    };

    P.forEach((p, i) => {
      const r = p.w / p.h;
      const widthWith = (sum + r) * T + GAP * row.length;
      if (widthWith >= W && row.length) {
        const hWith = (W - GAP * row.length) / (sum + r);
        const hWithout = (W - GAP * (row.length - 1)) / sum;
        if (Math.abs(hWith - T) <= Math.abs(hWithout - T)) {
          row.push(i); place(row, hWith, true); row = []; sum = 0; return;
        }
        place(row, hWithout, true); row = []; sum = 0;
      }
      if (r * T >= W) { place([i], W / r, true); return; }   // panorama wider than screen
      row.push(i); sum += r;
    });
    if (row.length) place(row, Math.min(T, (W - GAP * (row.length - 1)) / sum), false);
    grid.style.height = Math.max(0, y - GAP) + 'px';
  }
  new ResizeObserver(() => requestAnimationFrame(layout)).observe(grid);
  layout();

  /* ---------------- viewer ---------------- */
  let cur = -1, busy = null, pushed = false;

  function loadFull(i) {
    if (i < 0 || i >= P.length) return null;
    if (!fullCache.has(i)) {
      const im = new Image();
      im.decoding = 'async';
      im.src = P[i].f;
      fullCache.set(i, im.decode ? im.decode().then(() => im.src, () => im.src) : Promise.resolve(im.src));
    }
    return fullCache.get(i);
  }

  function fit(p) {
    const vw = lb.clientWidth, vh = lb.clientHeight;
    const m = vw < 700 ? 0 : Math.round(Math.min(40, vw * 0.025));
    const s = Math.min((vw - 2 * m) / p.w, (vh - 2 * m) / p.h);
    const w = p.w * s, h = p.h * s;
    return { x: (vw - w) / 2, y: (vh - h) / 2, w, h };
  }

  function show(i) {
    cur = i;
    const p = P[i], f = fit(p);
    Object.assign(img.style, { left: f.x + 'px', top: f.y + 'px', width: f.w + 'px', height: f.h + 'px', background: p.c });
    img.src = p.t;
    const want = i;
    loadFull(i).then(src => { if (cur === want) { img.src = src; img.style.background = 'none'; } });
    loadFull(i + 1); loadFull(i - 1);
    return f;
  }

  function flipFrom(rect, f) {
    return `translate(${rect.left - f.x}px, ${rect.top - f.y}px) scale(${rect.width / f.w}, ${rect.height / f.h})`;
  }

  function inView(el) {
    const r = el.getBoundingClientRect();
    return r.bottom > 0 && r.top < innerHeight && r.width > 0;
  }

  function open(i, fromGrid) {
    if (!lb.hidden) return;
    lb.hidden = false;
    document.documentElement.classList.add('lock');
    const f = show(i);
    const tile = tiles[i];
    if (fromGrid) {
      history.pushState({ lb: 1 }, '', '#' + P[i].id);
      pushed = true;
    }
    if (inView(tile)) {
      tile.classList.add('ghost');
      img.animate([{ transform: flipFrom(tile.getBoundingClientRect(), f) }, { transform: 'none' }], { duration: D, easing: EASE })
        .finished.then(() => tile.classList.remove('ghost'), () => tile.classList.remove('ghost'));
    } else {
      img.animate([{ opacity: 0, transform: 'scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: D, easing: EASE });
    }
    shade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: D, easing: 'ease-out' });
    nudgeIdle();
  }

  function close(viaHistory) {
    if (lb.hidden || busy === 'closing') return;
    busy = 'closing';
    img.getAnimations().forEach(a => a.cancel());
    const i = cur, tile = tiles[i], f = fit(P[i]);
    const start = img.style.transform || 'none';
    const startShade = getComputedStyle(shade).opacity;
    img.style.transform = ''; shade.style.opacity = '';
    document.documentElement.classList.remove('lock');
    if (!inView(tile)) tile.scrollIntoView({ block: 'center' });
    const r = tile.getBoundingClientRect();
    tile.classList.add('ghost');
    const done = () => {
      lb.hidden = true; busy = null; cur = -1;
      tile.classList.remove('ghost');
      tile.focus({ preventScroll: true });
    };
    img.animate([{ transform: start }, { transform: flipFrom(r, f) }], { duration: D * 0.85, easing: EASE, fill: 'forwards' })
      .finished.then(() => { img.getAnimations().forEach(a => a.cancel()); done(); }, done);
    shade.animate([{ opacity: startShade }, { opacity: 0 }], { duration: D * 0.85, easing: 'ease-out', fill: 'forwards' })
      .finished.then(() => shade.getAnimations().forEach(a => a.cancel()), () => {});
    if (!viaHistory) {
      if (pushed) { pushed = false; history.back(); }
      else history.replaceState(null, '', location.pathname + location.search);
    }
  }

  function go(dir, fromX = 0) {
    const n = cur + dir;
    if (busy) return;
    if (n < 0 || n >= P.length) {          // end of the line: gentle bounce
      img.animate([{ transform: `translateX(${fromX}px)` }, { transform: `translateX(${-dir * 24}px)` }, { transform: 'none' }],
        { duration: reduce ? 1 : 300, easing: 'ease-out' });
      img.style.transform = '';
      return;
    }
    busy = 'sliding';
    const w = lb.clientWidth;
    const out = img.animate(
      [{ transform: `translateX(${fromX}px)`, opacity: 1 }, { transform: `translateX(${-dir * w * 0.25}px)`, opacity: 0 }],
      { duration: reduce ? 1 : 150, easing: 'ease-in', fill: 'forwards' });
    img.style.transform = '';
    out.finished.then(() => {
      show(n);
      out.cancel();
      history.replaceState(history.state, '', '#' + P[n].id);
      return img.animate(
        [{ transform: `translateX(${dir * w * 0.12}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
        { duration: reduce ? 1 : 260, easing: EASE }).finished;
    }).finally(() => { busy = null; });
  }

  /* --- pointer: drag sideways to move, drag down to close, tap edges / middle --- */
  let ptr = null;
  lb.addEventListener('pointerdown', e => {
    if (busy || ptr) return;
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), axis: null, type: e.pointerType };
    try { lb.setPointerCapture(e.pointerId); } catch (_) {}
  });
  lb.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') { setZone(e.clientX); nudgeIdle(); }
    if (!ptr || e.pointerId !== ptr.id) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    if (!ptr.axis && Math.hypot(dx, dy) > 8) ptr.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (ptr.axis === 'x') {
      const edge = (cur === 0 && dx > 0) || (cur === P.length - 1 && dx < 0);
      img.style.transform = `translateX(${edge ? dx * 0.3 : dx}px)`;
    } else if (ptr.axis === 'y') {
      const d = Math.max(0, dy), k = Math.min(1, d / lb.clientHeight);
      img.style.transform = `translate(${dx * 0.4}px, ${dy}px) scale(${1 - k * 0.25})`;
      shade.style.opacity = String(1 - k * 1.4);
    }
  });
  const end = e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const p = ptr; ptr = null;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    const v = Math.abs(dx) / Math.max(1, performance.now() - p.t);
    if (e.type === 'pointercancel') { img.style.transform = ''; shade.style.opacity = ''; return; }
    if (p.axis === 'x') {
      if (Math.abs(dx) > 60 || v > 0.4) go(dx < 0 ? 1 : -1, dx);
      else snapBack();
    } else if (p.axis === 'y') {
      if (dy > 90 || (dy > 30 && Math.abs(dy) / (performance.now() - p.t) > 0.5)) close();
      else snapBack();
    } else {
      const z = zoneAt(e.clientX);
      if (z === 'prev') go(-1); else if (z === 'next') go(1); else close();
    }
  };
  lb.addEventListener('pointerup', end);
  lb.addEventListener('pointercancel', end);

  function snapBack() {
    const from = img.style.transform || 'none', so = shade.style.opacity || '1';
    img.style.transform = ''; shade.style.opacity = '';
    img.animate([{ transform: from }, { transform: 'none' }], { duration: reduce ? 1 : 220, easing: EASE });
    shade.animate([{ opacity: so }, { opacity: 1 }], { duration: reduce ? 1 : 220 });
  }

  function zoneAt(x) {
    const w = lb.clientWidth, edge = w < 700 ? 0.28 : 0.33;
    if (x < w * edge && cur > 0) return 'prev';
    if (x > w * (1 - edge) && cur < P.length - 1) return 'next';
    return 'close';
  }
  function setZone(x) {
    const z = zoneAt(x);
    lb.classList.toggle('prev', z === 'prev');
    lb.classList.toggle('next', z === 'next');
    lb.classList.toggle('close', z === 'close');
  }

  let idleT;
  function nudgeIdle() {
    lb.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => lb.classList.add('idle'), 1800);
  }

  addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });

  addEventListener('wheel', e => {
    if (lb.hidden || busy) return;
    if (Math.abs(e.deltaX) > 30 && Math.abs(e.deltaX) > Math.abs(e.deltaY)) go(e.deltaX > 0 ? 1 : -1);
  }, { passive: true });

  addEventListener('resize', () => { if (!lb.hidden && cur >= 0 && !busy) show(cur); });

  /* --- links: #photo-id opens that photo; back button closes --- */
  function fromHash() {
    const i = byId.get(decodeURIComponent(location.hash.slice(1)));
    if (i === undefined) { if (!lb.hidden) close(true); return; }
    if (lb.hidden) {
      tiles[i].scrollIntoView({ block: 'center' });
      open(i, false);
    } else if (i !== cur) { show(i); }
  }
  addEventListener('popstate', () => { pushed = false; fromHash(); });
  if (location.hash) requestAnimationFrame(fromHash);
})();
</script>
</body>
</html>
